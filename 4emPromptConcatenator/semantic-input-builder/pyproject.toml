[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-input-builder"
version = "0.1.0"
description = "Semantic input builder for an external 4EM ADL generation tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "4EM Prompt Concatenator Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
semantic-input-builder = "semantic_input_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
